<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYUK OS // SHELL DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04050c;
    --ph:#8fa2ff;      /* phosphor indigo */
    --dim:#4a5590;
    --faint:#161c3d;
    --bright:#e7ecff;
    --glow:0 0 8px rgba(143,162,255,.45), 0 0 24px rgba(143,162,255,.15);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#000;
    font-family:'IBM Plex Mono','Courier New',monospace;
    font-weight:300;
    color:var(--ph);
    overflow:hidden;
    user-select:none;
  }

  /* ---------- stage / phone frame ---------- */
  #stage{height:100%;display:flex;align-items:center;justify-content:center}
  #screen{
    position:relative;
    width:100%;height:100%;
    background:radial-gradient(ellipse 120% 80% at 50% 0%, #070a18 0%, var(--bg) 60%);
    overflow:hidden;
  }
  @media (min-width:700px){
    body{background:radial-gradient(ellipse at 50% 40%, #0a0d1f 0%, #000 70%)}
    #screen{
      width:390px;height:844px;
      border:1px solid var(--faint);
      outline:1px solid #0d1330;
      outline-offset:6px;
      border-radius:8px;
    }
  }

  /* ---------- CRT layers (subtle) ---------- */
  #screen::before{ /* faint scanlines */
    content:"";position:absolute;inset:0;z-index:40;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 4px);
  }
  #screen::after{ /* vignette */
    content:"";position:absolute;inset:0;z-index:41;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  }

  /* ---------- shared bits ---------- */
  .hidden{display:none !important}
  section{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column}
  .panel{
    position:relative;
    border:1px solid var(--faint);
    background:rgba(10,13,30,.45);
    backdrop-filter:blur(2px);
  }
  .corner{position:absolute;width:9px;height:9px;border:0 solid var(--ph);opacity:.8}
  .corner.tl{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
  .corner.tr{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
  .corner.bl{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
  .corner.br{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
  .glow{text-shadow:var(--glow)}

  /* ---------- boot ---------- */
  #boot{align-items:flex-start;justify-content:center;padding:34px;cursor:pointer;z-index:30}
  #bootlogo{
    font-family:'Space Grotesk',sans-serif;font-weight:300;
    font-size:32px;letter-spacing:14px;color:var(--bright);
    text-shadow:var(--glow);margin-bottom:6px;
  }
  #bootsub{font-size:12px;letter-spacing:4px;color:var(--dim);margin-bottom:34px}
  #bootlog{font-size:13px;line-height:24px;letter-spacing:1px;white-space:pre-wrap;min-height:170px;color:var(--ph)}
  #engage{
    align-self:center;margin-top:44px;
    font-size:14px;letter-spacing:7px;color:var(--bright);
    text-shadow:var(--glow);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- home ---------- */
  #home{padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:14px}
  #home.on{animation:crton .45s ease-out}
  @keyframes crton{
    0%{transform:scaleY(.004);filter:brightness(6)}
    55%{transform:scaleY(1);filter:brightness(2.2)}
    100%{transform:scaleY(1);filter:brightness(1)}
  }
  #statusbar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:2px;padding:2px 2px 0;color:var(--ph);
  }
  #statusbar .mid{color:var(--dim)}
  .sig{display:inline-flex;gap:2px;align-items:baseline;margin-right:7px}
  .sig i{width:3px;background:var(--ph);display:inline-block;border-radius:1px}
  .sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}
  .sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px;background:var(--faint)}
  .batt{
    display:inline-block;width:20px;height:10px;border:1px solid var(--dim);
    border-radius:2px;position:relative;vertical-align:-1px;margin-left:7px;
  }
  .batt::before{content:"";position:absolute;inset:1px;right:4px;background:var(--ph);border-radius:1px}
  .batt::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:var(--dim);border-radius:0 1px 1px 0}

  /* clock panel */
  #dossier{padding:20px 12px 16px;text-align:center}
  #clock{
    font-family:'Space Grotesk',sans-serif;font-weight:300;
    font-size:74px;line-height:74px;letter-spacing:3px;
    color:var(--bright);text-shadow:var(--glow);
  }
  #date{font-size:12px;letter-spacing:6px;color:var(--dim);margin-top:8px}

  /* app grid */
  #modules{flex:1;display:flex;flex-direction:column}
  .panel-title{font-size:10px;letter-spacing:3px;color:var(--dim);padding:10px 12px 0}
  #grid{
    flex:1;display:grid;grid-template-columns:repeat(4,1fr);
    align-content:space-evenly;gap:4px;padding:8px 8px 12px;
  }
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:8px 0}
  .app svg{
    width:26px;height:26px;color:var(--ph);
    fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(143,162,255,.45));
  }
  .app span{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:400}
  .app:active svg,.app.glitch svg{color:var(--bright)}
  .app.glitch{animation:glitch .3s steps(2)}
  @keyframes glitch{
    0%{transform:translate(2px,-1px)} 25%{transform:translate(-3px,1px)}
    50%{transform:translate(1px,2px) skewX(4deg)} 75%{transform:translate(-1px,-2px)}
    100%{transform:none}
  }

  /* dock */
  #dockpanel #dock{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px}
  #dockpanel .app span{color:var(--ph)}

  /* ticker */
  #ticker{overflow:hidden;white-space:nowrap;font-size:10px;letter-spacing:3px;color:var(--dim);padding:2px 0 0}
  #ticker span{display:inline-block;padding-right:60px;animation:tick 26s linear infinite}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* toast */
  #toast{
    position:absolute;z-index:50;top:44%;left:50%;transform:translate(-50%,-50%);
    border:1px solid var(--dim);
    background:rgba(5,7,15,.92);backdrop-filter:blur(6px);
    padding:18px 30px;text-align:center;
    box-shadow:var(--glow);
  }
  #toast .t1{font-size:15px;letter-spacing:4px;color:var(--bright);text-shadow:var(--glow);font-weight:400}
  #toast .t2{font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<div id="stage">
  <div id="screen">

    <!-- BOOT -->
    <section id="boot">
      <div id="bootlogo">RYUK OS</div>
      <div id="bootsub">v0.1 // NEURAL SHELL</div>
      <div id="bootlog"></div>
      <div id="engage" class="hidden">[ TAP TO ENGAGE ]</div>
    </section>

    <!-- HOME -->
    <section id="home" class="hidden">
      <header id="statusbar">
        <span><span class="sig"><i></i><i></i><i></i><i></i></span>RYUK.NET</span>
        <span class="mid">NO CARRIER</span>
        <span>87%<span class="batt"></span></span>
      </header>

      <div class="panel" id="dossier">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div id="clock">--:--</div>
        <div id="date">--- --.--.----</div>
      </div>

      <div class="panel" id="modules">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div class="panel-title">// MODULES</div>
        <div id="grid"></div>
      </div>

      <div class="panel" id="dockpanel">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div id="dock"></div>
      </div>

      <div id="ticker"><span></span></div>
    </section>

    <!-- TOAST -->
    <div id="toast" class="hidden">
      <div class="t1">// MODULE OFFLINE //</div>
      <div class="t2">DEMO SHELL · NO FUNCTIONS INSTALLED</div>
    </div>
  </div>
</div>

<script>
/* ---------------- line icons (24x24, stroke) ---------------- */
const ICONS = {
  feed:    '<circle cx="12" cy="12" r="9.5"/><path d="M10 8.5L16 12l-6 3.5z"/>',
  camera:  '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  photos:  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  music:   '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  maps:    '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  mail:    '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',
  notes:   '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
  vault:   '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  files:   '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  sync:    '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
  config:  '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/>',
  power:   '<path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/>',
  phone:   '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  msgs:    '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  net:     '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  term:    '<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>'
};

function iconSvg(name){
  return `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
}

const GRID_APPS = [
  ["FEED","feed"],["CAMERA","camera"],["PHOTOS","photos"],["MUSIC","music"],
  ["MAPS","maps"],["MAIL","mail"],["NOTES","notes"],["VAULT","vault"],
  ["FILES","files"],["SYNC","sync"],["CONFIG","config"],["POWER","power"]
];
const DOCK_APPS = [["PHONE","phone"],["MSGS","msgs"],["NET","net"],["TERM","term"]];

function buildApps(el, apps){
  apps.forEach(([label,icon])=>{
    const d = document.createElement("div");
    d.className = "app";
    d.innerHTML = iconSvg(icon) + `<span>${label}</span>`;
    d.addEventListener("click", ()=>tapApp(d));
    el.appendChild(d);
  });
}
buildApps(document.getElementById("grid"), GRID_APPS);
buildApps(document.getElementById("dock"), DOCK_APPS);

/* ---------------- boot sequence ---------------- */
const LOG_LINES = [
  "MEM CHECK · OK",
  "PHOSPHOR DRIVERS · OK",
  "CARRIER TRACKERS · PURGED",
  "ALGORITHM SCAN · NONE FOUND",
  "ALL SYSTEMS LOCAL",
  "",
  "READY FOR NEURAL SYNC_"
];
const bootlog = document.getElementById("bootlog");
const engage  = document.getElementById("engage");
let bootDone = false, li = 0;

function typeLines(){
  if(li >= LOG_LINES.length){ bootDone = true; engage.classList.remove("hidden"); return; }
  bootlog.textContent += LOG_LINES[li] + "\n";
  li++;
  setTimeout(typeLines, 280);
}
setTimeout(typeLines, 500);

document.getElementById("boot").addEventListener("click", ()=>{
  if(!bootDone){
    bootlog.textContent = LOG_LINES.join("\n") + "\n";
    li = LOG_LINES.length; bootDone = true;
    engage.classList.remove("hidden");
    return;
  }
  unlock();
});

function unlock(){
  document.getElementById("boot").classList.add("hidden");
  const home = document.getElementById("home");
  home.classList.remove("hidden");
  home.classList.add("on");
}

/* ---------------- clock ---------------- */
const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
function p(n){ return String(n).padStart(2,"0"); }
function tickClock(){
  const now = new Date();
  document.getElementById("clock").textContent = p(now.getHours()) + ":" + p(now.getMinutes());
  document.getElementById("date").textContent =
    DAYS[now.getDay()] + " " + p(now.getDate()) + "." + p(now.getMonth()+1) + "." + now.getFullYear();
}
tickClock();
setInterval(tickClock, 1000);

/* ---------------- ticker ---------------- */
const TICKER = "ALL SYSTEMS LOCAL ··· NO ALGORITHM DETECTED ··· YOUR ATTENTION IS NOT FOR SALE ··· ";
document.querySelector("#ticker span").textContent = TICKER + TICKER;

/* ---------------- app tap ---------------- */
const toast = document.getElementById("toast");
let toastTimer = null;
function tapApp(el){
  el.classList.remove("glitch");
  void el.offsetWidth;
  el.classList.add("glitch");
  toast.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.add("hidden"), 1300);
}
</script>
</body>
</html>
